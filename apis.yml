name: RouterPlex
description: >-
  RouterPlex is an OpenAI- and Anthropic-compatible AI gateway that fronts 39 chat and image models from 14 vendors —
  OpenAI, Anthropic, Google, DeepSeek, Moonshot, Alibaba, MiniMax, Zhipu, xAI and others — behind one API key and one
  prepaid balance, at vendor list prices with no markup and no top-up fee. It exposes OpenAI Chat Completions,
  the OpenAI Responses route for Codex, Anthropic Messages, image generation and a model catalog on a single v1 REST
  surface, so the official OpenAI and Anthropic SDKs work unmodified with only a base URL change. Per-key hard spend
  budgets, model allowlists and optional RPM/TPM limits are the containment model for autonomous agents. RouterPlex
  also runs an anonymous read-only MCP server for model discovery and publishes an RFC 9727 API catalog, an OpenAPI
  3.1 description, llms.txt and Markdown pricing and benchmark companions.
