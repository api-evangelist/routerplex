      - openapi/routerplex-inference-openapi.json#createMessage
    docs: https://docs.routerplex.com/errors
  - status: 5xx
    title: Upstream provider issue
    retryable: true
    remediation: >-
      Retry. RouterPlex fronts third-party model vendors; 5xx generally reflects the
      upstream vendor rather than the gateway.
    source_operations: []
    docs: https://docs.routerplex.com/errors
gaps:
  - >-
    The published OpenAPI declares no response schemas — every response is a bare
    description string, so error bodies are not machine-readable from the spec. The
    envelope above was harvested from the docs, not the contract.
  - >-
    No enumerated error.code registry is published, so an agent cannot statically
    distinguish "hard budget reached" from "transient rate limit" without parsing
    error.message.
  - >-
    404 is returned by the live API but is absent from the OpenAPI.
