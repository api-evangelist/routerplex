  - status: 429
    title: Rate limit or spend limit reached
    retryable: conditional
    remediation: >-
      Retry with backoff for a rate limit; do NOT retry a reached spend limit — a retry
      cannot raise a hard key budget. Read error.code to tell them apart. Causes: the
      60 req/s per-IP edge limit, an optional per-key RPM/TPM limit, an upstream provider
      limit, or a gateway spend-limit failure.
    source_operations:
