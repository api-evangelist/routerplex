divergence_summary: >-
  4 of 5 REST operations have no MCP tool, and 2 of 3 MCP tools have no REST
  operation. RouterPlex has deliberately split its surfaces: MCP is free, anonymous,
  read-only discovery; REST is keyed, metered execution. An agent can shop the
  catalog over MCP but must switch to REST — with a key and a prepaid balance — to
  actually run anything.
